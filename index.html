<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Ctext%20y%3D%27.9em%27%20font-size%3D%2790%27%3E%F0%9F%8F%A0%3C/text%3E%3C/svg%3E">
    <title>進学塾クロフネ｜塾生・保護者専用ページ</title>
<style>
/* ========== CSS変数（クロフネ共通パレット） ========== */
:root {
  /* クロフネ本体色 */
  --kf-navy: #1a3a5c;
  --kf-navy-mid: #2d4e6e;
  --kf-navy-light: #3d6a9f;
  --kf-navy-pale: #e8f0f9;
  --kf-navy-ultra: #f0f5fb;

  /* クリムゾン（アクセント） */
  --crimson: #C6000B;
  --crimson-dark: #A00008;
  --crimson-light: #FFF0F0;

  /* ステータス色 */
  --green: #16a34a;
  --green-dark: #15803d;
  --green-light: #dcfce7;
  --blue: #2563eb;
  --blue-light: #dbeafe;
  --amber: #d97706;
  --amber-light: #fef3c7;

  /* グレー系 */
  --surface: #f4f7fb;
  --surface2: #edf2f9;
  --border: #d6e0ed;
  --text: #1a2535;
  --text-muted: #5a6a7e;
  --text-light: #94a3b8;

  /* シャドウ */
  --shadow-sm: 0 1px 4px rgba(26,58,92,0.08);
  --shadow: 0 4px 16px rgba(26,58,92,0.10);
  --shadow-lg: 0 8px 32px rgba(26,58,92,0.14);

  /* 共通 */
  --radius: 10px;
  --radius-lg: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Hiragino Sans', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Meiryo', sans-serif;
  background: var(--surface);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ========== ログイン画面 ========== */
#loginScreen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: linear-gradient(150deg, #0f2540 0%, #1a3a5c 45%, #2d5a8e 100%);
  position: relative;
  overflow: hidden;
}
#loginScreen::before {
  content: '';
  position: absolute;
  width: 320px; height: 320px;
  background: rgba(255,255,255,0.04);
  border-radius: 50%;
  top: -80px; right: -80px;
}
#loginScreen::after {
  content: '';
  position: absolute;
  width: 200px; height: 200px;
  background: rgba(255,255,255,0.04);
  border-radius: 50%;
  bottom: -50px; left: -50px;
}
.login-card {
  background: white;
  border-radius: var(--radius-lg);
  padding: 40px 32px;
  width: 100%;
  max-width: 380px;
  box-shadow: var(--shadow-lg);
  text-align: center;
  position: relative;
  z-index: 1;
}
.login-logo {
  font-size: 20px;
  font-weight: bold;
  color: var(--kf-navy);
  margin-bottom: 4px;
  letter-spacing: 0.06em;
}
.login-sub {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 28px;
  letter-spacing: 0.04em;
}
.login-label {
  font-size: 12px;
  font-weight: bold;
  color: var(--text-muted);
  text-align: left;
  margin-bottom: 8px;
  display: block;
  letter-spacing: 0.03em;
}
.login-input {
  width: 100%;
  padding: 13px 16px;
  font-size: 16px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  margin-bottom: 16px;
  background: var(--surface);
  color: var(--text);
}
.login-input:focus {
  border-color: var(--kf-navy-light);
  background: white;
  box-shadow: 0 0 0 3px rgba(45,106,159,0.12);
}
.login-btn {
  width: 100%;
  padding: 14px;
  font-size: 15px;
  font-weight: bold;
  color: white;
  background: var(--kf-navy);
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  min-height: 50px;
  transition: background 0.2s, transform 0.1s;
  letter-spacing: 0.04em;
  font-family: inherit;
}
.login-btn:hover { background: var(--kf-navy-mid); }
.login-btn:active { transform: scale(0.98); }
.login-error {
  display: none;
  margin-top: 12px;
  padding: 10px 14px;
  background: #fef2f2;
  color: #dc2626;
  border-radius: 8px;
  font-size: 13px;
  border-left: 3px solid #dc2626;
}
.login-note {
  margin-top: 20px;
  font-size: 11px;
  color: var(--text-light);
  line-height: 1.7;
}

/* ========== メインコンテンツ ========== */
#mainContent { display: none; }

/* ========== 注意ポップアップ ========== */
#noticeOverlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(2px);
}
#noticeOverlay.show { display: flex; }
.notice-popup {
  background: #fff;
  border-radius: var(--radius-lg);
  padding: 32px 24px 24px;
  max-width: 320px;
  width: 90%;
  text-align: center;
  box-shadow: var(--shadow-lg);
}
.notice-popup .notice-icon { font-size: 38px; margin-bottom: 12px; }
.notice-popup h3 { font-size: 15px; font-weight: bold; color: var(--kf-navy); margin-bottom: 10px; }
.notice-popup p { font-size: 13px; color: var(--text-muted); line-height: 1.8; margin-bottom: 20px; }
.notice-popup button {
  background: var(--kf-navy);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  padding: 12px 32px;
  font-size: 14px;
  cursor: pointer;
  width: 100%;
  font-family: inherit;
  font-weight: bold;
  transition: background 0.2s;
}
.notice-popup button:hover { background: var(--kf-navy-mid); }

/* ========== ヘッダー ========== */
.site-header {
  background: linear-gradient(90deg, var(--kf-navy) 0%, var(--kf-navy-mid) 100%);
  color: white;
  padding: 10px 16px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.18);
}
.header-inner {
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.header-title { font-size: 15px; font-weight: bold; letter-spacing: 0.04em; }
.header-sub { font-size: 10px; opacity: 0.65; margin-top: 1px; letter-spacing: 0.04em; }
.header-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.logout-btn {
  font-size: 12px;
  color: rgba(255,255,255,0.85);
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 8px;
  padding: 7px 12px;
  cursor: pointer;
  min-height: 40px;
  white-space: nowrap;
  font-family: inherit;
  transition: background 0.2s;
}
.logout-btn:hover { background: rgba(255,255,255,0.22); }
.bell-label { display: inline; }
@media (max-width: 400px) {
  .bell-label { display: none; }
  .bell-btn { padding: 7px 10px; }
}

/* ========== タブバー ========== */
.tab-bar {
  background: white;
  border-bottom: 2px solid var(--border);
  position: sticky;
  top: 50px;
  z-index: 90;
  box-shadow: 0 2px 6px rgba(26,58,92,0.05);
}
.tab-inner {
  max-width: 720px;
  margin: 0 auto;
  display: flex;
}
.tab-btn {
  flex: 1;
  padding: 15px 8px 13px;
  font-size: 15px;
  font-weight: bold;
  color: var(--text-muted);
  background: none;
  border: none;
  border-bottom: 4px solid transparent;
  cursor: pointer;
  min-height: 56px;
  transition: color 0.2s, border-color 0.2s, background 0.2s;
  font-family: inherit;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  letter-spacing: 0.02em;
}
.tab-btn .tab-icon { width: 22px; height: 22px; display: inline-flex; align-items: center; }
.tab-btn .tab-icon svg { width: 22px; height: 22px; display: block; }
.tab-btn.active {
  color: #fff;
  border-bottom-color: var(--kf-navy);
  background: var(--kf-navy);
}
.tab-btn.active .tab-icon svg [data-fill]{ fill: #fff; }
.tab-btn:hover:not(.active) { color: var(--kf-navy-light); background: var(--surface); }

/* ========== コンテンツ ========== */
.content-wrap {
  max-width: 720px;
  margin: 0 auto;
  padding: 20px 14px 72px;
}
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ========== 入口選択画面（初回ログイン時のみ） ========== */
#entryChooser {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 200;
  background: var(--surface);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
#entryChooser.show { display: block; }
.entry-inner {
  max-width: 560px;
  margin: 0 auto;
  padding: 40px 18px 48px;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.entry-head {
  text-align: center;
  margin-bottom: 28px;
}
.entry-head .entry-logo {
  font-size: 15px;
  font-weight: bold;
  color: var(--kf-navy);
  letter-spacing: 0.06em;
  margin-bottom: 10px;
}
.entry-head h1 {
  font-size: 21px;
  font-weight: bold;
  color: var(--text);
  line-height: 1.5;
  margin: 0 0 6px;
}
.entry-head p {
  font-size: 14px;
  color: var(--text-muted);
  margin: 0;
}
.entry-cards {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.entry-card {
  display: flex;
  align-items: center;
  gap: 16px;
  width: 100%;
  text-align: left;
  background: #fff;
  border: 2px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px 18px;
  cursor: pointer;
  font-family: inherit;
  box-shadow: var(--shadow-sm);
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
}
.entry-card:hover { border-color: var(--kf-navy-light); box-shadow: var(--shadow); }
.entry-card:active { transform: scale(0.99); }
.entry-card-icon {
  flex-shrink: 0;
  width: 72px;
  height: 72px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.entry-card-icon svg { width: 48px; height: 48px; display: block; }
.entry-card.hogo .entry-card-icon { background: var(--blue-light); }
.entry-card.seito .entry-card-icon { background: var(--green-light); }
.entry-card-body { flex: 1; min-width: 0; }
.entry-card-title {
  font-size: 18px;
  font-weight: bold;
  color: var(--text);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.entry-card-desc {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.6;
}
.entry-card-arrow {
  flex-shrink: 0;
  color: var(--text-light);
  font-size: 20px;
}
.entry-note {
  text-align: center;
  font-size: 12px;
  color: var(--text-light);
  margin-top: 22px;
  line-height: 1.6;
}

/* ========== お知らせボックス ========== */
.notice-box {
  background: var(--kf-navy-ultra);
  border-left: 4px solid var(--kf-navy-light);
  border-radius: var(--radius);
  padding: 12px 16px;
  font-size: 13px;
  color: var(--kf-navy);
  margin-bottom: 20px;
  line-height: 1.6;
}

/* ========== カテゴリセクション ========== */
.category-section { margin-bottom: 24px; }

/* カテゴリ見出し（子レベル）*/
.section-header {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 12px;
  background: white;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  border-left: 3px solid var(--kf-navy-light);
  color: var(--kf-navy);
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 0.02em;
  margin-bottom: 6px;
}
.section-header .sec-icon {
  font-size: 13px;
  opacity: 0.75;
}
.section-header .sec-icon svg {
  width: 17px;
  height: 17px;
  display: block;
  opacity: 1;
}
.section-header .sec-icon { display: inline-flex; align-items: center; }


/* 旧 .category-title との互換性を維持しつつ新スタイルも提供 */
.category-title {
  font-size: 13px;
  font-weight: bold;
  color: var(--kf-navy);
  padding: 6px 0 6px 12px;
  border-left: 3px solid var(--kf-navy-light);
  margin-bottom: 10px;
  letter-spacing: 0.03em;
}
.category-desc {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 10px;
  line-height: 1.6;
  padding: 0 2px;
}

/* ========== ファイルカード ========== */
.file-card {
  background: white;
  border-radius: 0;
  border-left: 3px solid var(--kf-navy-light);
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--surface2);
  padding: 10px 12px;
  margin-bottom: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: background 0.15s;
}
.file-card:first-child { border-radius: var(--radius) var(--radius) 0 0; }
.file-card:last-child { border-radius: 0 0 var(--radius) var(--radius); border-bottom: 1px solid var(--border); }
.file-card:only-child { border-radius: var(--radius); }
.file-card:hover { background: var(--kf-navy-ultra); }

/* ファイルカード：カテゴリ別にある包括ラッパー */
.file-card-group {
  background: white;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  margin-bottom: 4px;
}
.file-card-group .file-card {
  border-radius: 0;
  border-left: 3px solid var(--kf-navy-light);
  border-bottom: 1px solid var(--border);
  border-right: none;
  margin-bottom: 0;
}
.file-card-group .file-card:last-child {
  border-bottom: none;
  border-radius: 0;
}

.file-icon {
  width: 32px; height: 32px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--kf-navy-pale);
  border-radius: 7px;
}
.file-info { flex: 1; min-width: 0; }
.file-name {
  font-size: 13px;
  font-weight: bold;
  color: var(--text);
  margin-bottom: 2px;
  line-height: 1.4;
}
.file-desc {
  font-size: 11px;
  color: var(--text-muted);
  line-height: 1.4;
}
.file-date {
  font-size: 10px;
  color: var(--text-light);
  margin-top: 2px;
}
.file-actions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
.btn-open, .btn-dl {
  padding: 9px 14px;
  font-size: 12px;
  font-weight: bold;
  border-radius: 8px;
  cursor: pointer;
  min-height: 40px;
  min-width: 56px;
  text-align: center;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  border: none;
  font-family: inherit;
  transition: background 0.15s, transform 0.1s;
  white-space: nowrap;
}
.btn-open:active, .btn-dl:active { transform: scale(0.96); }
.btn-open {
  background: var(--kf-navy);
  color: white;
}
.btn-open:hover { background: var(--kf-navy-mid); }
/* 案A：生徒タブの「開く」も濃紺に統一 */
#panelSeito .btn-open { background: var(--kf-navy); }
#panelSeito .btn-open:hover { background: var(--kf-navy-mid); }
.btn-dl {
  background: var(--surface2);
  color: var(--text-muted);
  border: 1.5px solid var(--border);
}
.btn-dl:hover { background: var(--border); color: var(--text); }

/* ========== タブ用スマホラベル ========== */
.tab-label-sp { display: none; }
.tab-label-pc { display: inline; }

/* ========== スマホ対応 ========== */
@media (max-width: 560px) {
  .file-card { flex-wrap: wrap; }
  .file-actions { width: 100%; margin-top: 8px; }
  .btn-open, .btn-dl { flex: 1; }
  .login-card { padding: 32px 18px; }
  .tab-label-pc { display: none; }
  .tab-label-sp { display: inline; }
  .tab-btn { font-size: 12px; padding: 11px 4px 9px; }
  .tab-btn .tab-icon { font-size: 15px; }
  .content-wrap { padding: 16px 12px 72px; }
}

/* ========== テスト完全攻略セクション ========== */
.test-guide-section {
  margin: 0 0 24px;
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow);
  border: 1.5px solid var(--kf-navy);
}
.test-guide-header {
  background: linear-gradient(90deg, var(--kf-navy) 0%, #2d5a8e 100%);
  color: white;
  font-size: 16px;
  font-weight: bold;
  padding: 14px 18px;
  text-align: center;
  letter-spacing: 0.06em;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.test-guide-block {
  padding: 16px 16px 14px;
  border-bottom: 3px solid var(--surface);
  background: #fff;
}
.test-guide-block + .test-guide-block { padding-top: 20px; }
.test-guide-block:last-child { border-bottom: none; }
.test-guide-title {
  font-size: 14px;
  font-weight: bold;
  color: var(--kf-navy);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.test-guide-title svg { width: 18px; height: 18px; flex-shrink: 0; }
.test-guide-text {
  font-size: 13px;
  color: var(--text-muted);
  margin: 0 0 8px;
}
.test-guide-list {
  font-size: 13px;
  color: var(--text);
  list-style: none;
  padding-left: 0;
  margin: 0 0 12px;
  line-height: 1;
}
.test-guide-list li {
  position: relative;
  padding: 6px 0 6px 28px;
  border-bottom: 1px solid var(--surface2);
}
.test-guide-list li:last-child { border-bottom: none; }
.test-guide-list li::before {
  content: '✓';
  position: absolute;
  left: 0;
  top: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  background: var(--green);
  color: white;
  border-radius: 50%;
  font-size: 11px;
  font-weight: bold;
}
.tg-key {
  color: var(--kf-navy);
  font-weight: bold;
}
.test-guide-imgs {
  display: flex;
  flex-direction: row;
  gap: 8px;
  margin-top: 12px;
  align-items: flex-start;
}
.test-guide-img {
  width: 50%;
  aspect-ratio: 4 / 3;
  object-fit: contain;
  object-position: center;
  border-radius: 8px;
  border: 1px solid var(--border);
  display: block;
  background: var(--surface);
  pointer-events: none;
  -webkit-user-select: none;
  user-select: none;
  box-shadow: var(--shadow-sm);
}
.test-guide-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  padding: 12px;
  background: var(--kf-navy);
  color: white;
  border: none;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 12px;
  text-align: center;
  font-family: inherit;
  transition: background 0.15s, transform 0.1s;
  letter-spacing: 0.02em;
}
.test-guide-btn:hover { background: var(--kf-navy-mid); }
.test-guide-btn:active { transform: scale(0.98); }

/* ========== やり方ブロック ========== */
.howto-block {
  background: #fffdf5;
  border: 1px solid #fde68a;
  border-left: 3px solid var(--amber);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 10px;
}
.howto-label {
  font-size: 11px;
  font-weight: bold;
  color: var(--amber);
  margin-bottom: 6px;
  letter-spacing: 0.04em;
}
.howto-text {
  font-size: 13px;
  color: var(--text);
  line-height: 1.7;
  margin-bottom: 10px;
}
.howto-img {
  width: 100%;
  max-height: 360px;
  object-fit: cover;
  object-position: top;
  border-radius: 8px;
  border: 1px solid var(--border);
  display: block;
  box-shadow: var(--shadow-sm);
  pointer-events: none;
  -webkit-user-select: none;
  user-select: none;
}

/* ========== PDFモーダル ========== */
#pdfOverlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.88);

function kfB64d(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function kfB64e(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function kfDerive(pw){
  return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits'])
    .then(function(base){ return crypto.subtle.deriveBits({name:'PBKDF2', salt:kfB64d(ENC.salt), iterations:ENC.iter, hash:'SHA-256'}, base, 256); })
    .then(function(bits){ return new Uint8Array(bits); });
}
var kfOpened = false;
function kfOpen(raw, auto){
  return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt'])
    .then(function(key){ return crypto.subtle.decrypt({name:'AES-GCM', iv:kfB64d(ENC.iv)}, key, kfB64d(ENC.ct)); })
    .then(function(pt){
      if (kfOpened) return;
      kfOpened = true;
      var p = JSON.parse(new TextDecoder().decode(pt));
      document.getElementById('secureRoot').outerHTML = p.html;
      var sc = document.createElement('script'); sc.textContent = p.js; document.body.appendChild(sc);
      showMain();
      if (auto) restoreTabAndTarget();
    });
}
function checkPassword(){
  var inp = document.getElementById('pwInput'), pw = inp.value;
  if (!pw) return;
  var btn = document.querySelector('#loginForm .login-btn'); if (btn) { btn.disabled = true; btn.textContent = '確認中…'; }
  kfDerive(pw).then(function(raw){
    return kfOpen(raw, false).then(function(){
      try { localStorage.setItem('lib_key', kfB64e(raw)); localStorage.removeItem('lib_auth'); } catch (e) {}
    });
  }).catch(function(){
    document.getElementById('pwError').style.display = 'block';
    inp.value = ''; inp.focus();
  }).then(function(){ if (btn) { btn.disabled = false; btn.textContent = '入室する'; } });
}
window.addEventListener('DOMContentLoaded', function(){
  var k = null; try { k = localStorage.getItem('lib_key'); } catch (e) {}
  if (k) kfOpen(kfB64d(k), true).catch(function(){ try { localStorage.removeItem('lib_key'); } catch (e) {} });
});
</script>
